type Query {
  viewer: Viewer
  rooms(engine: RoomEngine, difficulty: RoomDifficulty, district: String): [Room!]!
  roomBySlug(slug: String!): Room
}

input PublishRoomVersionInput {
  clientRequestId: ID!
  roomSlug: String!
  version: Int!
  changelog: String!
  bundleHashSha256: String!
  activate: Boolean!
}

type PublishRoomVersionPayload {
  roomVersion: RoomVersion!
}

type Mutation {
  publishRoomVersion(input: PublishRoomVersionInput!): PublishRoomVersionPayload!
}

type Viewer {
  userId: ID!
  role: String!
  githubUsername: String
}

type Room {
  id: ID!
  slug: String!
  title: String!
  district: String!
  engine: RoomEngine!
  difficulty: RoomDifficulty!
  description: String!
  latestVersion: RoomVersion
}

type RoomVersion {
  id: ID!
  versionNumber: Int!
  status: RoomVersionStatus!
  changelog: String!
  publishedAt: String!
}

enum RoomEngine { A B }
enum RoomDifficulty { L0 L1 L2 L3 }
enum RoomVersionStatus { PUBLISHED DEPRECATED DISABLED }
